name: github-perfil
description: Perfil público de una organización o usuario de GitHub (tamaño del equipo
  técnico, actividad).
category: Username
version: 1.0
input:
  type: Username
  key: value
request:
  method: GET
  url: https://api.github.com/users/{{value}}
  headers:
    User-Agent: flowsint-enricher
    Accept: application/vnd.github+json
  timeout: 15
response:
  expect: json
  map:
    id: html_url
    username: login
    display_name: name
    profile_url: html_url
    profile_picture_url: avatar_url
    bio: bio
    location: location
    created_at: created_at
    followers_count: followers
    posts_count: public_repos
output:
  type: SocialAccount
retry:
  max_retries: 2
  backoff_factor: 1.0
  retry_on_status:
  - 429
  - 500
  - 502
  - 503
  - 504

