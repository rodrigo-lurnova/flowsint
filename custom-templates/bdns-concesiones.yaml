name: bdns-concesiones
description: 'Paso 2 BDNS: subvenciones concedidas a la empresa (usa el id del campo
  siren que deja bdns-tercero). Cada nodo enlaza al boletín oficial de la concesión.'
category: Organization
version: 1.0
input:
  type: Organization
  key: siren
request:
  method: GET
  url: https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda
  params:
    vpd: GE
    beneficiario: '{{siren}}'
    page: '0'
    pageSize: '100'
    order: fechaConcesion
    direccion: desc
  headers:
    Accept: application/json
    User-Agent: flowsint-enricher
  timeout: 30
response:
  expect: json
  map:
    url: urlBR
    title: convocatoria
    description: instrumento
output:
  type: Website
  is_array: true
  array_path: content
retry:
  max_retries: 2
  backoff_factor: 1.0
  retry_on_status:
  - 429
  - 500
  - 502
  - 503
  - 504

